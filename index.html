<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ClassSpace Manager</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{fontFamily:{sans:['Plus Jakarta Sans','Noto Sans JP','sans-serif']}}}}</script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body><div class="app-shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">CS</span><span><b>ClassSpace</b><small>ROOM CONTROL</small></span></div><nav id="main-nav"><button class="nav-item active" data-view="timeline"><span>▦</span>タイムライン</button><button class="nav-item" data-view="requests"><span>↗</span>申請センター <i id="request-badge" class="badge hidden">0</i></button><button class="nav-item" data-view="groups"><span>⌂</span>グループ管理</button><button class="nav-item admin-only hidden" data-view="settings"><span>⚙</span>システム設定</button></nav><div class="sidebar-footer"><div class="status-dot"></div><span>システム正常稼働中</span></div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">CAMPUS / ROOM CONTROL</div><h1 id="page-title">空き教室を、すぐ見つける。</h1></div><div class="top-actions"><button class="icon-button" id="notification-button" title="通知" aria-label="通知">♢<i id="notification-badge" class="badge hidden">0</i></button><div class="user-chip"><div class="avatar" id="user-avatar">S</div><div><b id="user-name">デモユーザー</b><small id="user-role">生徒</small></div></div></div></header><section id="timeline-view" class="view"><div class="toolbar"><div class="date-control"><button class="icon-button" id="prev-day" aria-label="前の日">‹</button><button class="date-label" id="date-label">今日</button><button class="icon-button" id="next-day" aria-label="次の日">›</button></div><div class="toolbar-actions"><button class="secondary-button" id="today-button">今日</button><button class="primary-button" id="new-reservation">＋ 予約を作成</button></div></div><div class="filter-bar" aria-label="教室を絞り込む"><label>建物 <select id="building-filter"><option value="">すべて</option></select></label><label>最低定員 <select id="capacity-filter"><option value="0">指定なし</option><option value="30">30名以上</option><option value="50">50名以上</option><option value="80">80名以上</option></select></label><label><input type="checkbox" id="special-filter"> 特別許可不要</label></div><div class="legend"><span><i class="legend-free"></i>予約可能</span><span><i class="legend-busy"></i>予約済み</span><span><i class="legend-locked"></i>授業中</span><span class="scroll-hint">横にスクロールして時間帯を確認 →</span></div><div class="timeline-wrap"><div id="timeline" class="timeline"></div></div></section><section id="requests-view" class="view hidden"><div class="section-heading"><div><div class="eyebrow">WORKFLOW</div><h2>申請センター</h2></div><span class="count-pill" id="request-count">0 件</span></div><div id="requests-list" class="stack-list"></div></section><section id="groups-view" class="view hidden"><div class="section-heading"><div><div class="eyebrow">COMMUNITY</div><h2>グループ管理</h2></div><button class="primary-button" id="new-group">＋ グループを作成</button></div><div id="groups-list" class="groups-grid"></div></section><section id="settings-view" class="view hidden"><div class="section-heading"><div><div class="eyebrow">ADMINISTRATION</div><h2>システム設定</h2></div></div><div id="settings-list" class="settings-panel"></div></section></main></div><div id="modal-root"></div><div id="toast" class="toast"></div><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/timeline.js"></script><script src="js/app.js"></script></body></html>
